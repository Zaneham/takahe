name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Test
        run: make test

  # The frontend's score against the IEEE 1800 conformance suite. A floor
  # rather than a target: it stops the number sliding while the language
  # coverage grows, and raising the floor is how progress gets recorded.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Fetch sv-tests
        run: git clone --depth 1 https://github.com/chipsalliance/sv-tests.git /tmp/sv-tests

      # Invoked through bash rather than relying on the executable bit, which
      # a checkout on Windows does not preserve.
      - name: Score
        run: bash tools/sv-tests.sh /tmp/sv-tests --min 66

  synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Every design is at or above its cell floor
        run: bash tools/synth-gate.sh

  equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Every design survives its own optimiser
        run: bash tools/equiv-gate.sh

  netlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Install iverilog
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iverilog

      - name: Another tool can read what we emit
        run: bash tools/netlist-parse.sh

  # Hostile input through instrumentation. The adv suite feeds in binary junk,
  # two-thousand-deep nesting and pools shrunk to eight, which is only worth
  # running if something is watching the memory while it happens.
  #
  # Leak detection is off for now. The engine allocates its pools once and
  # does not always hand them back, so turning it on today would report the
  # design rather than a bug. Worth a separate pass.
  sanitisers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Build and test under ASan and UBSan
        run: make SAN=1 CC=clang test

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Test
        run: make test

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Test
        run: make test
